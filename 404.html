  <script>
    (function () {
      const FACES = [
        ["Almost Swiss", [100, 400, 900]],
        ["Spacjinx", [300, 500, 900]],
        ["Askew", [200, 400, 600]],
        ["Seamless", [300, 500, 700]],
        ["Plainspoken", [200, 400, 700]],
      ];
      const el = document.getElementById("nf");
      const box = el.parentElement;
      const pick = (list) => list[Math.floor(Math.random() * list.length)];
      let face;

      // As large as the room allows, in whichever direction this typeface runs out first
      const draw = () => {
        el.style.fontFamily = `"${face[0]}", sans-serif`;
        el.style.fontWeight = pick(face[1]);
        el.style.fontSize = "200px";
        const size = 200 * Math.min(box.clientWidth / el.offsetWidth, box.clientHeight / el.offsetHeight);
        el.style.fontSize = size + "px";
      };
      const next = () => {
        face = pick(FACES.filter((f) => f !== face));
        document.body.classList.toggle("is-dark");
        draw();
      };

      next();
      window.addEventListener("resize", draw);
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const loads = FACES.flatMap(([name, weights]) => weights.map((w) => document.fonts.load(`${w} 200px "${name}"`, "404")));
      // 2.5 flips a second: as chaotic as it gets while staying under the 3 a second limit for flashing
      Promise.all(loads).then(() => window.setInterval(next, 400));
    })();
  </script>
