<!doctype html>
<html lang="en" data-theme="black">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ΔE Grade Lab: colour grading presets from directors, series, films, photographers and film stocks, turned into image-edit prompts for Nano Banana, GPT Image and FLUX.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='%23fff' font-family='Times New Roman,Times,serif'%3E%CE%94E%3C/text%3E%3C/svg%3E">
<title>ΔE Grade Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Three columns: presets | stage | prompt. */
:root{
  --col-l:280px;
  --col-r:400px;
  --gut:20px;
  --f-ui:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --f-times:"Times New Roman",Times,serif;
}
:root,:root[data-theme="black"]{
  color-scheme:dark;
  --ground:#000;--panel:rgba(0,0,0,.94);--stage:#0b0b0b;
  --ink:#fff;--dim:#8a8a8a;--faint:#4a4a4a;
  --line:rgba(255,255,255,.18);--hover:rgba(255,255,255,.08);--tint:rgba(255,255,255,.16);
}
:root[data-theme="white"]{
  color-scheme:light;
  --ground:#fff;--panel:rgba(255,255,255,.94);--stage:#f2f2f2;
  --ink:#000;--dim:#6e6e6e;--faint:#b4b4b4;
  --line:rgba(0,0,0,.16);--hover:rgba(0,0,0,.05);--tint:rgba(0,0,0,.1);
}
*{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--ground);color:var(--ink);font:13px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:1px solid var(--ink);outline-offset:-1px}
[hidden]{display:none!important}
.label{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

/* Header */
header{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:var(--col-l) minmax(0,1fr) var(--col-r);align-items:center;height:64px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header>*{padding:0 var(--gut)}
.logo{display:flex;justify-content:space-between;align-items:last baseline;gap:10px;white-space:nowrap}
.logo b{font:400 30px/1 var(--f-times);letter-spacing:-.01em}
.logo span{line-height:1.3;text-align:right}
.search{position:relative}
.search input{width:100%;height:36px;padding:0 36px 0 0;background:none;border:0;border-bottom:1px solid var(--line);outline:none;font-size:14px}
.search input:focus{border-bottom-color:var(--ink)}
.search input::placeholder{color:var(--dim)}
.search input::-webkit-search-cancel-button{display:none}
.search kbd{position:absolute;right:var(--gut);top:9px;font-size:10px;color:var(--dim);border:1px solid var(--line);padding:0 5px;line-height:16px;pointer-events:none}
.ctrl{display:flex;justify-content:flex-end;align-items:center;gap:16px}
.themes{display:flex;gap:8px}
.themes button{width:14px;height:14px;border:1px solid var(--dim)}
.themes [data-theme="black"]{background:#000}
.themes [data-theme="white"]{background:#fff}
.themes [aria-pressed="true"]{outline:1px solid var(--ink);outline-offset:2px}

/* Layout */
.wrap{display:grid;grid-template-columns:var(--col-l) minmax(0,1fr) var(--col-r);height:calc(100vh - 64px);height:calc(100dvh - 64px)}
.wrap>*{min-height:0;overflow:auto}
#presets{border-right:1px solid var(--line);padding-bottom:40px}
#prompt{border-left:1px solid var(--line)}

/* Preset list */
.cat{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;padding:14px var(--gut) 8px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pre{display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;align-items:center;width:100%;padding:6px var(--gut);text-align:left}
.pre:hover{background:var(--hover)}
.pre[aria-current="true"]{background:var(--tint)}
.pre canvas{display:block;width:60px;height:40px;background:var(--stage)}
.pre b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pre small{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:20px var(--gut);color:var(--dim)}

/* Stage */
#center{display:flex;flex-direction:column;background:var(--stage)}
.stage{position:relative;flex:1;min-height:280px;display:flex;align-items:center;justify-content:center;padding:var(--gut);overflow:hidden}
.frame{position:relative;max-width:100%;max-height:100%;line-height:0;touch-action:none;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.frame canvas{display:block;max-width:100%;max-height:calc(100vh - 64px - 190px);max-height:calc(100dvh - 64px - 190px)}
#orig{position:absolute;inset:0;width:100%;height:100%}
.split{position:absolute;top:0;bottom:0;width:1px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.4);pointer-events:none}
.split::after{content:"";position:absolute;top:50%;left:-6px;width:13px;height:13px;margin-top:-6px;background:linear-gradient(90deg,#fff 50%,#777 50%);box-shadow:0 0 0 .5px rgba(0,0,0,.4)}
.tag{position:absolute;top:10px;line-height:1;padding:5px 6px;background:rgba(0,0,0,.55);color:#fff}
.tag.l{left:10px}.tag.r{right:10px}
.status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.drop{position:absolute;inset:var(--gut);border:1px dashed var(--ink);display:flex;align-items:center;justify-content:center;background:var(--panel);z-index:5;pointer-events:none}

.strip{border-top:1px solid var(--line);background:var(--ground);padding:12px var(--gut) 14px}
.strip .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.credit{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit a{color:inherit}
.thumbs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.thumb{position:relative;text-align:left}
.thumb .img{display:block;width:100%;aspect-ratio:3/2;background:var(--stage) center/cover no-repeat;border:1px solid transparent}
.thumb[aria-pressed="true"] .img{border-color:var(--ink)}
.thumb span{display:block;margin-top:4px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb[aria-pressed="true"] span{color:var(--ink)}
.thumb.add .img{display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);font-size:20px;color:var(--dim)}
.thumb.add:hover .img{border-color:var(--ink);color:var(--ink)}

/* Prompt column */
.sec{padding:16px var(--gut);border-bottom:1px solid var(--line)}
.title{font:400 34px/1.05 var(--f-times);letter-spacing:-.01em;margin:6px 0 6px}
.ref{color:var(--dim);margin:0}
.sw{display:flex;margin:14px 0 10px;height:14px}
.sw i{flex:1}
.look{margin:0}
.key{margin:12px 0 0;font:italic 400 17px/1.3 var(--f-times)}
.src{margin:8px 0 0;font-size:11px;color:var(--dim)}
.src a{color:inherit}
.models{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.models button{padding:14px 0 12px;text-align:center;border-bottom:1px solid transparent;margin-bottom:-1px;color:var(--dim)}
.models button small{display:block;font-size:10px;color:var(--faint)}
.models [aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.models [aria-pressed="true"] small{color:var(--dim)}
.out{position:relative}
#text{display:block;width:100%;min-height:300px;padding:16px var(--gut);background:none;border:0;outline:none;resize:vertical;font-size:12px;line-height:1.6;color:var(--ink)}
.acts{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 var(--gut) 16px}
.btn{height:36px;padding:0 16px;border:1px solid var(--line)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.count{font-size:11px;color:var(--dim)}
.hint{font-size:11px;color:var(--dim);margin:10px 0 0}

.ctl{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:12px;margin:10px 0}
.seg{display:flex;gap:14px;flex-wrap:wrap}
.seg button{color:var(--dim);border-bottom:1px solid transparent;padding:2px 0}
.seg [aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
input[type=range]::-moz-range-track{height:1px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-5px;background:var(--ink);border:0}
input[type=range]::-moz-range-thumb{width:11px;height:11px;background:var(--ink);border:0;border-radius:0}
.val{display:flex;justify-content:space-between;gap:10px}
.val output{color:var(--dim);min-width:56px;text-align:right}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;padding:8px 14px;background:var(--ink);color:var(--ground);transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Narrow screens: stack stage, presets, prompt. */
@media (max-width:1100px){
  :root{--col-l:240px;--col-r:340px}
}
@media (max-width:860px){
  :root{--gut:16px}
  header{grid-template-columns:auto minmax(0,1fr) auto;gap:0}
  .logo span{display:none}
  .wrap{display:block;height:auto}
  .wrap>*{overflow:visible}
  #center{order:-1}
  #presets{border:0;border-top:1px solid var(--line);max-height:46vh;overflow:auto}
  #prompt{border:0;border-top:1px solid var(--line)}
  .frame canvas{max-height:60vh}
  .stage{min-height:0}
  .thumbs{grid-template-columns:repeat(4,minmax(0,1fr))}
  .mobile-order{display:flex;flex-direction:column}
}
</style>
</head>
<body>
<header>
  <div class="logo"><b>ΔE</b><span class="label">Grade<br>Lab</span></div>
  <div class="search">
    <input id="q" type="search" placeholder="Search — Fincher, neon, Portra, green" autocomplete="off" spellcheck="false" aria-label="Search presets">
    <kbd>/</kbd>
  </div>
  <div class="ctrl">
    <div class="themes" role="group" aria-label="Theme">
      <button data-theme="black" aria-pressed="true" title="Black" aria-label="Black"></button>
      <button data-theme="white" aria-pressed="false" title="White" aria-label="White"></button>
    </div>
  </div>
</header>

<div class="wrap mobile-order">
  <nav id="presets" aria-label="Presets"></nav>

  <main id="center">
    <div class="stage" id="stage">
      <div class="frame" id="frame">
        <canvas id="out" aria-label="Graded preview"></canvas>
        <canvas id="orig" aria-hidden="true"></canvas>
        <div class="split" id="split"></div>
        <span class="tag l label">Before</span>
        <span class="tag r label">After</span>
      </div>
      <div class="status" id="status">Loading image…</div>
      <div class="drop" id="drop" hidden><span class="label">Drop image</span></div>
    </div>
    <div class="strip">
      <div class="row">
        <span class="label">Test images</span>
        <span class="credit" id="credit"></span>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
  </main>

  <aside id="prompt">
    <div class="sec">
      <div class="label" id="pcat">Preset</div>
      <h1 class="title" id="pname">—</h1>
      <p class="ref" id="pref"></p>
      <div class="sw" id="psw"></div>
      <p class="look" id="plook"></p>
      <p class="key" id="pkey" hidden></p>
      <p class="src" id="psrc" hidden></p>
    </div>

    <div class="models" role="group" aria-label="Model" id="models"></div>
    <div class="out">
      <textarea id="text" spellcheck="false" aria-label="Prompt"></textarea>
    </div>
    <div class="acts">
      <span class="count" id="count"></span>
      <button class="btn primary" id="copy">Copy prompt</button>
    </div>

    <div class="sec" style="border-top:1px solid var(--line)">
      <div class="label">Shot</div>
      <div class="ctl"><span>Strength</span>
        <div class="val"><input type="range" id="k" min="20" max="100" step="5" value="80" aria-label="Strength"><output id="kout"></output></div>
      </div>
      <div class="ctl"><span>Person</span>
        <div class="seg" data-key="person"><button data-v="1">Yes</button><button data-v="0">No</button></div>
      </div>
      <div class="ctl"><span>Place</span>
        <div class="seg" data-key="where"><button data-v="in">Inside</button><button data-v="out">Outside</button></div>
      </div>
      <div class="ctl"><span>Time</span>
        <div class="seg" data-key="time"><button data-v="day">Day</button><button data-v="night">Night</button></div>
      </div>
      <div class="ctl"><span>Light</span>
        <div class="seg" data-key="atmo"><button data-v="0">Keep</button><button data-v="1">Shape</button></div>
      </div>
      <p class="hint">The preview is a rough sketch of the grade, done in the browser. The prompt carries the real look.<br>Keys: <b>↑ ↓</b> preset, <b>← →</b> image, <b>Space</b> before, <b>C</b> copy.</p>
    </div>
  </aside>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// ---------- Test images (Unsplash, hotlinked with credit) ----------
const IMAGES = [
  {id:'window', label:'Window', src:'photo-1630754157861-e4ffc56bc000', by:'Joonas Sild', u:'joonas1233', scene:{person:'1',where:'in',time:'day'}},
  {id:'park',   label:'Park',   src:'photo-1767396857504-99375ab21c1a', by:'Fotografía Editorial', u:'fotografiaeditorial', scene:{person:'1',where:'out',time:'day'}},
  {id:'diner',  label:'Diner',  src:'photo-1784075292370-86c2e07dac41', by:'bahareh moradian', u:'bahar_mr', scene:{person:'1',where:'in',time:'day'}},
  {id:'alley',  label:'Alley',  src:'photo-1534214526114-0ea4d47b04f2', by:'Alex Knight', u:'agk42', scene:{person:'0',where:'out',time:'night'}},
  {id:'snow',   label:'Snow',   src:'photo-1520084848344-f4c32b3f7b51', by:'Madara Parma', u:'madaratravels', scene:{person:'0',where:'out',time:'day'}},
  {id:'desert', label:'Desert', src:'photo-1553152531-b98a2fc8d3bf', by:'Johannes Plenio', u:'jplenio', scene:{person:'0',where:'out',time:'day'}},
];
const imgUrl = (src, w) => `https://images.unsplash.com/${src}?w=${w}&q=80&auto=format&fit=max`;

// ---------- Models ----------
const MODELS = [
  {id:'nano', name:'Nano Banana', by:'Google Gemini'},
  {id:'gpt',  name:'GPT Image',   by:'OpenAI'},
  {id:'flux', name:'FLUX.2',      by:'Black Forest Labs'},
];

// ---------- Presets ----------
// as: how the prompt names the reference. p: preview sketch —
// t temp, g tint (+magenta), s sat, c contrast, l lift, w white, sh/hi split-tone RGB, gr grain, v vignette.
const CATS = {dir:'Directors', tv:'Series', film:'Films', photo:'Photographers', stock:'Film stocks'};
const PRESETS = [
// Directors
{id:'anderson',cat:'dir',name:'Wes Anderson',ref:'The Grand Budapest Hotel · Moonrise Kingdom — DP Robert Yeoman, colourist Jill Bogdanowicz',as:"the colour grading of Wes Anderson's The Grand Budapest Hotel (colourist Jill Bogdanowicz)",

 key:'A colour world can be an entire period of time.',src:['Lowepost','https://lowepost.com/color-grading/case-studies/grand-budapest-hotel-r19/'],
 sw:['#E8A6A1','#9E2A2B','#A7C7C2','#F2C14E','#F3E3C3'],p:{t:.25,g:.1,s:1.15,c:-.1,l:.06,w:.97,sh:[.03,.01,-.01],hi:[.02,.01,-.02],gr:.02,v:.05}},
{id:'wkw',cat:'dir',name:'Wong Kar-wai',ref:'In the Mood for Love — DPs Christopher Doyle, Mark Lee Ping-bin',as:"the colour of Wong Kar-wai's In the Mood for Love, shot by Christopher Doyle and Mark Lee Ping-bin",

 key:'Colour is strongest when it lives in the world itself, not only in the grade.',src:['The Criterion Collection','https://www.criterion.com/films/198-in-the-mood-for-love'],
 sw:['#1B1710','#522525','#8E372D','#285240','#D99B61'],p:{t:.2,g:-.15,s:1.3,c:.3,l:0,w:1,sh:[-.01,.02,0],hi:[.05,.02,-.04],gr:.06,v:.3}},
{id:'fincher',cat:'dir',name:'David Fincher',ref:'Se7en · Zodiac · Gone Girl — DPs Darius Khondji, Jeff Cronenweth',as:"the colour of David Fincher's Se7en, shot by Darius Khondji with silver-retention (Deluxe CCE) prints",

{id:'villeneuve',cat:'dir',name:'Denis Villeneuve',ref:"Dune · Sicario · Arrival — DPs Greig Fraser, Roger Deakins, Bradford Young",as:"the colour grading of Denis Villeneuve's films (Dune, Sicario, Arrival)",

{id:'refn',cat:'dir',name:'Nicolas Winding Refn',ref:'Drive — DP Newton Thomas Sigel',as:"the night colour of Nicolas Winding Refn's Drive, shot by Newton Thomas Sigel",

{id:'coppola',cat:'dir',name:'Sofia Coppola',ref:"Lost in Translation · The Virgin Suicides — DPs Lance Acord, Ed Lachman",as:"the colour grading of Sofia Coppola's films (Lost in Translation, The Virgin Suicides)",

// ---------- State ----------
const $ = id => document.getElementById(id);
const store = {get(k,d){try{const v=localStorage.getItem('deltae-'+k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem('deltae-'+k,v)}catch(e){}}};
const state = {
  preset: PRESETS[1].id,
  image: IMAGES[0].id,
  model: store.get('model','nano'),
  k: 80,
  scene: {person:'1',where:'in',time:'day',atmo:'0'},
  split: .5,
};
let visible = PRESETS.slice();

// ---------- Grade (preview sketch) ----------
function hash(i){i=(i^61)^(i>>>16);i=i+(i<<3);i=i^(i>>>4);i=Math.imul(i,0x27d4eb2d);i=i^(i>>>15);return (i>>>0)/4294967296}
function grade(from, to, P, k){
  const d=from.data, o=to.data, W=from.width, H=from.height;
  const t=P.t*k, g=P.g*k, s=1+(P.s-1)*k, c=P.c*k, l=P.l*k, w=1+(P.w-1)*k, gr=P.gr*k, v=P.v*k;
  const sh=P.sh.map(x=>x*k*2.2), hi=P.hi.map(x=>x*k*2.2); // split-tone scaled so subtle presets still read
  const R=(1+.32*t)*(1+.03*g), G=1-.15*g, B=(1-.32*t)*(1+.03*g);
  const gs=Math.max(W,H)/600; // grain scales with size so it reads the same in thumbs
  for(let y=0,i=0;y<H;y++){
    const dy=y/H-.5;
    for(let x=0;x<W;x++,i+=4){
      let r=d[i]/255*R, gg=d[i+1]/255*G, b=d[i+2]/255*B;
      let L=.2126*r+.7152*gg+.0722*b;
      r=L+(r-L)*s; gg=L+(gg-L)*s; b=L+(b-L)*s;
      r=r<0?0:r>1?1:r; gg=gg<0?0:gg>1?1:gg; b=b<0?0:b>1?1:b;
      r+=c*(r*r*(3-2*r)-r); gg+=c*(gg*gg*(3-2*gg)-gg); b+=c*(b*b*(3-2*b)-b);
      L=.2126*r+.7152*gg+.0722*b;
      const ws=(1-L)*(1-L), wh=L*L;
      r+=sh[0]*ws+hi[0]*wh; gg+=sh[1]*ws+hi[1]*wh; b+=sh[2]*ws+hi[2]*wh;
      r=l+r*(w-l); gg=l+gg*(w-l); b=l+b*(w-l);
      const dx=x/W-.5, m=1-v*(dx*dx+dy*dy)*1.6;
      const n=gr?(hash(((y/gs|0)*4099+(x/gs|0))|0)-.5)*gr:0;
      o[i]=(r*m+n)*255; o[i+1]=(gg*m+n)*255; o[i+2]=(b*m+n)*255; o[i+3]=255;
    }
  }
}

// ---------- Image loading ----------
const out=$('out'), orig=$('orig'), octx=out.getContext('2d'), gctx=orig.getContext('2d');
const thumbSize=[120,80];
function loadImage(url){
  return new Promise((res,rej)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=rej;im.src=url});
}
async function setImage(id){
  state.image=id;
  const meta=IMAGES.find(i=>i.id===id);
  let url;
  if(id==='custom'){url=custom.url}else{url=imgUrl(meta.src,1600);Object.assign(state.scene,meta.scene)}
  $('status').hidden=false;$('status').textContent='Loading image…';
  renderThumbs();renderScene();renderCredit();renderPrompt();
  try{
    const im=await loadImage(url);
    if(state.image!==id)return;
    const max=1400, sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
    const W=Math.round(im.naturalWidth*sc), H=Math.round(im.naturalHeight*sc);
    out.width=orig.width=W; out.height=orig.height=H;
    gctx.drawImage(im,0,0,W,H);
    src=gctx.getImageData(0,0,W,H);
    // small source for preset thumbnails, cover-cropped to 3:2
    const tc=document.createElement('canvas');tc.width=thumbSize[0];tc.height=thumbSize[1];
    const tx=tc.getContext('2d'), ar=W/H, tar=3/2;
    let sw=W,sh=H,sx=0,sy=0;
    if(ar>tar){sw=H*tar;sx=(W-sw)/2}else{sh=W/tar;sy=(H-sh)/2}
    tx.drawImage(orig,sx,sy,sw,sh,0,0,tc.width,tc.height);
    small=tx.getImageData(0,0,tc.width,tc.height);
    $('status').hidden=true;
    draw();drawPresetThumbs();
  }catch(e){
    $('status').hidden=false;$('status').textContent='Could not load the image.';
  }
  writeHash();
}
function draw(){
  if(!src)return;
  const P=cur().p, img=octx.createImageData(src.width,src.height);
  grade(src,img,P,state.k/100);
  octx.putImageData(img,0,0);
  setSplit(state.split);
}
function drawPresetThumbs(){
  if(!small)return;
  for(const c of document.querySelectorAll('.pre canvas')){
    const P=PRESETS.find(p=>p.id===c.dataset.id).p;
    const ctx=c.getContext('2d'), img=ctx.createImageData(small.width,small.height);
    grade(small,img,P,state.k/100);
    ctx.putImageData(img,0,0);
  }
}

// ---------- Split compare ----------
function setSplit(f){
  state.split=Math.max(0,Math.min(1,f));
  orig.style.clipPath=`inset(0 ${(1-state.split)*100}% 0 0)`;
  $('split').style.left=(state.split*100)+'%';
}
(()=>{
  const fr=$('frame');let on=false;
  const at=e=>{const r=out.getBoundingClientRect();setSplit((e.clientX-r.left)/r.width)};
  fr.addEventListener('pointerdown',e=>{on=true;fr.setPointerCapture(e.pointerId);at(e)});
  fr.addEventListener('pointermove',e=>{if(on)at(e)});
  fr.addEventListener('pointerup',()=>on=false);
  fr.addEventListener('pointercancel',()=>on=false);
})();

// ---------- Prompts ----------
const cur=()=>PRESETS.find(p=>p.id===state.preset);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const end=s=>/[.!?]$/.test(s)?s:s+'.';
function strengthWord(k){return k<45?'subtle':k<75?'clear':k<95?'strong':'full'}
function strengthLine(k){
  return {subtle:'Apply it subtly — a gentle shift toward the look, still close to the original.',
    clear:'Apply it clearly but with restraint, so the photo still looks natural.',
    strong:'Apply it strongly — the look should be unmistakable.',
    full:'Apply it at full strength, as committed as the reference itself.'}[strengthWord(k)];
}
function sceneLines(p,sc){
  const L=[];
  if(sc.person==='1')L.push(`Skin: ${p.skin}; keep skin believable and consistent across faces.`);
  if(sc.time==='night')L.push('Night scene: keep practical lights as the brightest points; do not brighten it into day.');
  else if(sc.where==='out')L.push('Daylight exterior: carry the palette through sky, foliage and ground so it reads as one grade.');
  if(sc.where==='in')L.push('Interior: grade window light and lamps consistently with the look.');
  return L;
}
function lightLine(sc,short){
  return sc.atmo==='1'
    ? (short?'You may shape the light subtly (haze, falloff, bloom) to suit the look, without changing any content.':'You may shape the light subtly to suit the look — haze, light falloff, bloom or halation — but do not change any content.')
    : (short?'Do not relight, add haze or change the time of day.':'Do not relight the scene, add haze or change the time of day.');
}
function build(model){
  const p=cur(), sc=state.scene, k=state.k, bw=p.p.s===0;
  const keep='composition, framing, aspect ratio, every person\'s face, identity and expression, pose, clothing, background and every object';
  if(model==='nano'){
    return [
      bw?`Using the provided photo, convert it to black and white in the manner of ${p.as}. This is a tonal edit only: keep the ${keep} exactly as they are.`
        :`Using the provided photo, apply a colour grade inspired by ${p.as}. This is a colour grade only: keep the ${keep} exactly as they are.`,
      '',
      `The look is ${p.look}. ${bw?'Tonally it is':'The palette moves toward'} ${p.pal}. ${cap(end(p.tone))} ${cap(end(p.tex))}${p.key?' The idea behind it: '+p.key.charAt(0).toLowerCase()+p.key.slice(1):''}`,
      ...sceneLines(p,sc).length?['',sceneLines(p,sc).join(' ')]:[],
      '',
      `${strengthLine(k)} ${lightLine(sc)}`,
      '',
      `Avoid ${p.avoid}. Return the whole image at its original aspect ratio and resolution.`
    ].join('\n');
  }
  if(model==='gpt'){
    const lines=[
      bw?'Edit the attached photo. Convert it to black and white and change ONLY the tone.':'Edit the attached photo. Change ONLY the colour grade.',
      '',
      `Reference: ${cap(p.as)}.`,
      `Look: ${p.look}.`,
      `${bw?'Tonal range':'Palette'}: ${p.pal}.`,
      `Tone: ${p.tone}.`,
    ];
    if(p.key)lines.push(`Principle: ${p.key}`);
    if(sc.person==='1')lines.push(`Skin: ${p.skin}; believable and consistent across faces.`);
    lines.push(`Texture: ${p.tex}.`);
    if(sc.time==='night')lines.push('Scene: night — keep practical lights as the brightest points.');
    else if(sc.where==='out')lines.push('Scene: daylight exterior — carry the palette through sky, foliage and ground.');
    else lines.push('Scene: interior — grade window light and lamps consistently.');
    lines.push(`Strength: ${strengthWord(k)}.`,'',
      `Preserve exactly: ${keep}. Do not add, remove or redraw anything. Do not re-render or retouch faces. ${lightLine(sc,true)}`,
      '',
      `Avoid: ${p.avoid}${bw?'.':'; and no overall yellow or sepia cast unless the palette above asks for it.'}`);
    return lines.join('\n');
  }
  // FLUX.2: compact, direct verb, hex colours, explicit "keep".
  const skin=sc.person==='1'?` Skin ${p.skin}.`:'';
  const scene=sc.time==='night'?' Keep practical lights as the brightest points.':'';
  const how={subtle:'subtly',clear:'clearly but naturally',strong:'strongly',full:'at full strength'}[strengthWord(k)];
  return `${bw?'Convert this photo to black and white to match':'Change the colour grading of this photo to match'} ${p.as}: ${p.look}. ${bw?'Tonal range':'Palette'}: ${p.pal} (${p.sw.join(', ')}). ${cap(end(p.tone))}${skin} ${cap(end(p.tex))}${scene} Apply the look ${how}. Keep the exact same composition, framing, subject identity, facial features, pose, clothing and every object — only ${bw?'tone changes':'colour and tone change'}. ${lightLine(sc,true)} Avoid ${p.avoid}.`;
}

// ---------- Render UI ----------
function renderPresets(){
  const nav=$('presets');nav.innerHTML='';
  if(!visible.length){nav.innerHTML='<div class="empty">No preset matches.</div>';return}
  for(const [key,title] of Object.entries(CATS)){
    const items=visible.filter(p=>p.cat===key);if(!items.length)continue;
    const h=document.createElement('div');h.className='cat label';h.innerHTML=`<span>${title}</span><span>${items.length}</span>`;nav.append(h);
    for(const p of items){
      const b=document.createElement('button');b.className='pre';b.dataset.id=p.id;
      b.setAttribute('aria-current',p.id===state.preset);
      b.innerHTML=`<canvas width="${thumbSize[0]}" height="${thumbSize[1]}" data-id="${p.id}"></canvas><span><b>${p.name}</b><small>${p.ref}</small></span>`;
      b.onclick=()=>pick(p.id);
      nav.append(b);
    }
  }
  drawPresetThumbs();
}
function renderInfo(){
  const p=cur();
  $('pcat').textContent={dir:'Director',tv:'Series',film:'Film',photo:'Photographer',stock:'Film stock'}[p.cat];
  $('pname').textContent=p.name;
  $('pref').textContent=p.ref;
  $('psw').innerHTML=p.sw.map(c=>`<i style="background:${c}" title="${c}"></i>`).join('');
  $('plook').textContent=cap(p.look)+'.';
  $('pkey').hidden=!p.key;$('pkey').textContent=p.key?`“${p.key.replace(/\.$/,'')}”`:'';
  $('psrc').hidden=!p.src;$('psrc').innerHTML=p.src?`Source <a href="${p.src[1]}" target="_blank" rel="noopener">${p.src[0]}</a>`:'';
}
function renderModels(){
  $('models').innerHTML=MODELS.map(m=>`<button data-m="${m.id}" aria-pressed="${m.id===state.model}">${m.name}<small>${m.by}</small></button>`).join('');
  for(const b of $('models').children)b.onclick=()=>{state.model=b.dataset.m;store.set('model',state.model);renderModels();renderPrompt();writeHash()};
}
function renderPrompt(){
  const t=build(state.model);$('text').value=t;
  $('count').textContent=`${t.length} characters`;
}
function renderThumbs(){
  const box=$('thumbs');
  box.innerHTML=IMAGES.map(i=>`<button class="thumb" data-id="${i.id}" aria-pressed="${i.id===state.image}"><span class="img" style="background-image:url('${imgUrl(i.src,240)}')"></span><span>${i.label}</span></button>`).join('')
    +(custom?`<button class="thumb" data-id="custom" aria-pressed="${state.image==='custom'}"><span class="img" style="background-image:url('${custom.url}')"></span><span>Yours</span></button>`
            :`<button class="thumb add" data-id="add" title="Use your own image"><span class="img">+</span><span>Your image</span></button>`);
  for(const b of box.children)b.onclick=()=>b.dataset.id==='add'?$('file').click():setImage(b.dataset.id);
}
function renderCredit(){
  const m=IMAGES.find(i=>i.id===state.image);
  $('credit').innerHTML=m?`Photo <a href="https://unsplash.com/@${m.u}?utm_source=delta_e_lab&utm_medium=referral" target="_blank" rel="noopener">${m.by}</a> / <a href="https://unsplash.com/?utm_source=delta_e_lab&utm_medium=referral" target="_blank" rel="noopener">Unsplash</a>`:(custom?custom.name:'');
}
function renderScene(){
  for(const seg of document.querySelectorAll('.seg')){
    const key=seg.dataset.key;
    for(const b of seg.children)b.setAttribute('aria-pressed',state.scene[key]===b.dataset.v);
  }
  $('kout').textContent=cap(strengthWord(state.k));
}
for(const seg of document.querySelectorAll('.seg'))
  for(const b of seg.children)b.onclick=()=>{state.scene[seg.dataset.key]=b.dataset.v;renderScene();renderPrompt()};
$('k').oninput=e=>{state.k=+e.target.value;renderScene();renderPrompt();draw()};
$('k').onchange=()=>drawPresetThumbs();

function pick(id){
  state.preset=id;
  for(const b of document.querySelectorAll('.pre'))b.setAttribute('aria-current',b.dataset.id===id);
  renderInfo();renderPrompt();draw();writeHash();
}

// ---------- Search ----------
$('q').oninput=e=>{
  const q=e.target.value.trim().toLowerCase();
  visible=q?PRESETS.filter(p=>[p.name,p.ref,p.look,p.pal,CATS[p.cat]].join(' ').toLowerCase().includes(q)):PRESETS.slice();
  renderPresets();
};

// ---------- Copy ----------
let tt;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1400)}
async function copy(){
  try{await navigator.clipboard.writeText($('text').value)}catch(e){$('text').select();document.execCommand('copy')}
  toast(`Copied — ${MODELS.find(m=>m.id===state.model).name}`);
}
$('copy').onclick=copy;
$('text').oninput=()=>$('count').textContent=`${$('text').value.length} characters`;

// ---------- Own image ----------
function useFile(f){
  if(!f||!f.type.startsWith('image/'))return;
  if(custom)URL.revokeObjectURL(custom.url);
  custom={url:URL.createObjectURL(f),name:f.name};
  setImage('custom');
}
$('file').onchange=e=>useFile(e.target.files[0]);
let dragN=0;
addEventListener('dragenter',e=>{if([...e.dataTransfer.types].includes('Files')){dragN++;$('drop').hidden=false}});
addEventListener('dragleave',()=>{if(--dragN<=0){dragN=0;$('drop').hidden=true}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragN=0;$('drop').hidden=true;useFile(e.dataTransfer.files[0])});
addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])][0];if(f)useFile(f)});

// ---------- Keys ----------
let held=null;
addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(e.key==='/'&&!typing){e.preventDefault();$('q').focus();return}
  if(e.key==='Escape'&&document.activeElement===$('q')){$('q').value='';$('q').dispatchEvent(new Event('input'));$('q').blur();return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    const list=visible.length?visible:PRESETS, i=list.findIndex(p=>p.id===state.preset);
    const n=list[(i+(e.key==='ArrowDown'?1:-1)+list.length)%list.length];
    pick(n.id);document.querySelector(`.pre[data-id="${n.id}"]`)?.scrollIntoView({block:'nearest'});
  }else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    e.preventDefault();
    const ids=IMAGES.map(i=>i.id).concat(custom?['custom']:[]), i=ids.indexOf(state.image);
    setImage(ids[(i+(e.key==='ArrowRight'?1:-1)+ids.length)%ids.length]);
  }else if(e.key===' '){
    e.preventDefault();if(!e.repeat){held=state.split;setSplit(1)}
  }else if(e.key==='c'||e.key==='C'){copy()}
});
addEventListener('keyup',e=>{if(e.key===' '&&held!=null){setSplit(held);held=null}});

// ---------- Theme ----------
function setTheme(t){document.documentElement.dataset.theme=t;store.set('theme',t);
  for(const b of document.querySelectorAll('.themes button'))b.setAttribute('aria-pressed',b.dataset.theme===t);
  document.querySelector('meta[name=theme-color]').content=t==='white'?'#ffffff':'#000000'}
for(const b of document.querySelectorAll('.themes button'))b.onclick=()=>setTheme(b.dataset.theme);

// ---------- URL hash: #preset/image/model ----------
function writeHash(){const img=state.image==='custom'?IMAGES[0].id:state.image;history.replaceState(null,'',`#${state.preset}/${img}/${state.model}`)}
function readHash(){
  const [p,i,m]=location.hash.slice(1).split('/');
  if(PRESETS.some(x=>x.id===p))state.preset=p;
  if(IMAGES.some(x=>x.id===i))state.image=i;
  if(MODELS.some(x=>x.id===m))state.model=m;
}

// ---------- Start ----------
setTheme(store.get('theme','black'));
readHash();
$('k').value=state.k;
renderPresets();renderInfo();renderModels();renderScene();renderPrompt();
setImage(state.image);
document.querySelector(`.pre[data-id="${state.preset}"]`)?.scrollIntoView({block:'center'});
window.deltaE={state,PRESETS,build,pick,setImage};
</script>
</body>
</html>
