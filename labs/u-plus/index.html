<!doctype html>
<html lang="en" data-theme="black" data-font="times">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="U+ Glyph Lab: click a character to copy it. Arrows, quotes, spaces, math, shapes and more, with names and codes.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23fff' font-family='Times New Roman,Times,serif'%3EU+%3C/text%3E%3C/svg%3E">
<title>U+ Glyph Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* One column system shared by header, body and tray: index | specimens | inspector. */
:root{
  --col-l:240px;
  --col-r:300px;
  --gut:20px;
  --tile:68px;
  --tray-h:64px;
  --f-ui:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --f-sym:"Apple Symbols","Segoe UI Symbol","Noto Sans Symbols 2","Noto Sans Symbols","Noto Sans Math";
  --f-times:"Times New Roman",Times,var(--f-sym),serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,var(--f-sym),monospace;
  --f-glyph:var(--f-times);
}
:root[data-font="mono"]{--f-glyph:var(--f-mono)}
:root,:root[data-theme="black"]{
  color-scheme:dark;
  --ground:#000;--raised:#000;--panel:rgba(0,0,0,.94);
  --ink:#fff;--dim:#8a8a8a;--faint:#4a4a4a;
  --line:rgba(255,255,255,.18);--hover:rgba(255,255,255,.08);--tint:rgba(255,255,255,.22);
}
:root[data-theme="white"]{
  color-scheme:light;
  --ground:#fff;--raised:#fff;--panel:rgba(255,255,255,.94);
  --ink:#000;--dim:#6e6e6e;--faint:#b4b4b4;
  --line:rgba(0,0,0,.16);--hover:rgba(0,0,0,.05);--tint:rgba(0,0,0,.14);
}
:root[data-theme="paper"]{
  color-scheme:light;
  --ground:#eee8da;--raised:#eee8da;--panel:rgba(238,232,218,.95);
  --ink:#1b1a17;--dim:#6f6a5e;--faint:#b2ab9b;
  --line:rgba(27,26,23,.2);--hover:rgba(27,26,23,.06);--tint:rgba(27,26,23,.16);
}
*{box-sizing:border-box;border-radius:0}
html{scroll-padding-top:120px}
body{margin:0;background:var(--ground);color:var(--ink);font:13px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--ink);outline-offset:-1px}
[hidden]{display:none!important}
.label{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

/* Header */
header{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:var(--col-l) minmax(0,1fr) var(--col-r);align-items:center;height:64px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header>*{padding:0 var(--gut)}
.logo{display:flex;justify-content:space-between;align-items:last baseline;gap:10px;white-space:nowrap}
.logo b{font:400 30px/1 var(--f-times);letter-spacing:-.01em}
.logo span{line-height:1.3;text-align:right}
.search{position:relative}
.search input{width:100%;height:36px;padding:0 36px 0 0;background:none;border:0;border-bottom:1px solid var(--line);outline:none;font-size:14px}
.search input:focus{border-bottom-color:var(--ink)}
.search input::placeholder{color:var(--dim)}
.search input::-webkit-search-cancel-button{display:none}
.search kbd{position:absolute;right:var(--gut);top:9px;font-size:10px;color:var(--dim);border:1px solid var(--line);padding:0 5px;line-height:16px;pointer-events:none}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:16px}
.opts{display:flex;align-items:center;gap:12px}
.opts button{background:none;border:0;padding:4px 0;color:var(--dim);border-bottom:1px solid transparent}
.opts button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.opts button:hover{color:var(--ink)}
.fonts button[data-font="times"]{font:15px var(--f-times)}
.fonts button[data-font="mono"]{font-size:12px}
.themes button{width:16px;height:16px;padding:0;border:1px solid var(--line)}
.themes button[aria-pressed="true"]{box-shadow:0 0 0 1px var(--ground),0 0 0 2px var(--ink)}
.themes [data-theme="black"]{background:#000}
.themes [data-theme="white"]{background:#fff}
.themes [data-theme="paper"]{background:#eee8da}

/* Layout */
.wrap{display:grid;grid-template-columns:var(--col-l) minmax(0,1fr) var(--col-r);min-height:calc(100vh - 64px)}
nav{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 64px - var(--tray-h));overflow:auto;padding:20px var(--gut)}
nav .label{display:flex;justify-content:space-between;padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--line)}
nav a{display:grid;grid-template-columns:minmax(0,1fr) 3.5ch;gap:12px;padding:4px 0;color:var(--dim);text-decoration:none}
nav a b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav a span{text-align:right;font-variant-numeric:tabular-nums;color:var(--faint)}
nav a:hover,nav a:hover span{color:var(--ink)}
nav a.on,nav a.on span{color:var(--ink)}
main{padding:0 var(--gut) calc(var(--tray-h) + 40px);min-width:0;border-left:1px solid var(--line)}
section{padding-top:20px}
section h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0;padding-bottom:8px;font:500 10px/1.5 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
section h2 em{font-style:normal;margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:0}
section h2 button{background:none;border:0;padding:0;color:var(--faint);font:inherit;letter-spacing:.1em}
section h2 button:hover{color:var(--ink)}

/* Tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.t{position:relative;aspect-ratio:1;display:grid;place-items:center;background:none;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;font-family:var(--f-glyph);font-size:30px;line-height:1;overflow:hidden}
.t:hover{background:var(--hover)}
.t.sel{background:var(--ink);color:var(--ground)}
.t.sel small{color:var(--ground)}
.t.flash{animation:flash .45s ease-out}
@keyframes flash{from{background:var(--tint)}to{background:transparent}}
.t .sp{display:flex;flex-direction:column;align-items:center;gap:8px}
.t .w{display:flex;align-items:stretch;height:22px;border-left:1px solid currentColor;border-right:1px solid currentColor}
.t .w i{font-style:normal;background:var(--tint);white-space:pre}
.t .w.zero{border-left-style:dashed;border-right:0;width:0}
.t small{font:500 9px var(--f-ui);letter-spacing:.06em;color:var(--dim)}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.grid.wide .t{aspect-ratio:auto;height:64px;font-size:19px;padding:0 12px;white-space:pre}
.empty{padding:40px 0;color:var(--dim)}

/* Inspector */
aside{position:sticky;top:64px;align-self:start;height:calc(100vh - 64px - var(--tray-h));padding:20px var(--gut);border-left:1px solid var(--line);overflow:auto}
aside>.label{display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--line)}
.big{display:grid;place-items:center;height:240px;border-bottom:1px solid var(--line);font-family:var(--f-glyph);font-size:150px;line-height:1;overflow:hidden;white-space:pre}
.big.long{font-size:28px;padding:0 12px;text-align:center}
.big .w{display:flex;height:130px;border-left:1px solid var(--ink);border-right:1px solid var(--ink)}
.big .w i{font-style:normal;background:var(--tint);white-space:pre}
.name{margin:0;padding:14px 0;font:400 22px/1.15 var(--f-times);border-bottom:1px solid var(--line);min-height:56px;text-transform:capitalize}
.codes button{display:grid;grid-template-columns:9ch minmax(0,1fr);gap:12px;width:100%;padding:7px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.codes button span{color:var(--dim)}
.codes button code{font:inherit;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.codes button:hover code{text-decoration:underline;text-underline-offset:3px}
.codes button.ok code::before{content:"copied  ";color:var(--dim)}
.hint{margin-top:20px;color:var(--dim);font-size:11px;line-height:1.7}
.hint b{color:var(--ink);font-weight:400}

/* Tray */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:var(--col-l) minmax(0,1fr) var(--col-r);align-items:center;height:var(--tray-h);padding-bottom:env(safe-area-inset-bottom,0);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.tray>*{padding:0 var(--gut)}
.tray .field{display:flex}
.tray input{flex:1;min-width:0;height:40px;padding:0;background:none;border:0;border-bottom:1px solid var(--line);font-family:var(--f-glyph);font-size:24px;outline:none}
.tray input:focus{border-bottom-color:var(--ink)}
.tray input::placeholder{font:13px var(--f-ui);color:var(--faint)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:40px;padding:0 14px;border:1px solid var(--ink);background:none;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink);color:var(--ground)}
.btn.primary:hover{opacity:.85}
.toast{position:fixed;left:50%;bottom:calc(var(--tray-h) + 14px);z-index:40;transform:translate(-50%,6px);padding:8px 14px;background:var(--ink);color:var(--ground);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{font:400 16px var(--f-glyph)}

/* Favorites, links, dropped font */
aside>.label .nb{display:flex;align-items:center;gap:10px}
aside>.label .nb button{background:none;border:0;padding:0;color:var(--dim);font:inherit}
aside>.label .nb button:hover{color:var(--ink)}
.iacts{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.iacts button{background:none;border:0;padding:9px 0;text-align:left;color:var(--dim);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
.iacts button+button{text-align:right}
.iacts button:hover,.iacts button[aria-pressed="true"]{color:var(--ink)}
.fontnote{margin:0;padding:7px 0;border-bottom:1px solid var(--line);color:var(--dim);font-size:11px}
.fonts .drop-btn{max-width:11ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.fonts .add,.fonts .x{font-size:12px}
:root[data-font="drop"]{--f-glyph:var(--f-drop),var(--f-sym),serif}
:root[data-font="drop"] .t.miss{color:var(--faint)}
:root:not([data-font="drop"]) .cov{display:none}
.cov{margin-left:14px;color:var(--faint);letter-spacing:.06em}
.dropzone{position:fixed;inset:12px;z-index:50;display:none;place-items:center;align-content:center;background:var(--panel);border:1px solid var(--ink);text-align:center;pointer-events:none}
.dropzone.on{display:grid}
.dropzone b{display:block;margin-bottom:16px;font:400 72px/1 var(--f-times)}

/* Text X-ray */
nav .label.idx{margin-top:24px}
#xrIn{display:block;width:100%;min-height:150px;padding:12px 0;background:none;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:20px/1.5 var(--f-glyph);resize:vertical;outline:none}
#xrIn:focus{border-bottom-color:var(--ink)}
#xrIn::placeholder{font:13px var(--f-ui);color:var(--faint)}
.xr-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
.link{background:none;border:0;padding:0;color:var(--dim);font-size:11px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.xr-out{padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:20px/2 var(--f-glyph);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--dim);max-height:60vh;overflow:auto}
.xr-out .none{font:13px var(--f-ui);color:var(--faint)}
.xc{color:var(--ink)}
.xc:hover{background:var(--hover)}
.xc.hi{box-shadow:inset 0 -1px 0 var(--ink)}
.xc.warn{background:var(--tint)}
.xc.sp{position:relative}
.xc.sp::after{content:"·";position:absolute;left:0;right:0;text-align:center;color:var(--faint)}
.xc.ws{color:var(--faint)}
.xc.pill{font:500 9px/1 var(--f-ui);letter-spacing:.06em;border:1px solid currentColor;padding:2px 3px;margin:0 1px;vertical-align:4px}
.xc.sel{background:var(--ink);color:var(--ground);box-shadow:none}
.xc.sel::after{color:var(--ground)}
section h2 .opts{gap:10px;text-transform:none;letter-spacing:0}
section h2 .opts button{font:15px var(--f-times);padding:0 0 1px}
.rules{border-top:1px solid var(--line)}
.rule{display:grid;grid-template-columns:12px minmax(0,1fr) auto 3ch;gap:14px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rule code{font:16px var(--f-glyph);color:var(--dim);white-space:nowrap}
.rule em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.rule.none,.rule.none code{color:var(--faint)}
.rule input{appearance:none;-webkit-appearance:none;width:12px;height:12px;margin:0;border:1px solid var(--ink);cursor:pointer}
.rule input:checked{background:var(--ink)}
.xr-acts{display:flex;gap:8px;justify-content:flex-end;padding-top:12px}
.t .n{position:absolute;top:4px;right:6px;font:500 9px var(--f-ui);color:var(--dim)}
.t.sel .n{color:var(--ground)}
.xr-hint{margin:16px 0 0}

@media (max-width:1100px){
  :root{--col-r:auto}
  .wrap{grid-template-columns:var(--col-l) minmax(0,1fr)}
  aside{display:none}
}
@media (max-width:720px){
  :root{--tile:56px;--tray-h:60px;--gut:16px}
  html{scroll-padding-top:150px}
  header{grid-template-columns:1fr auto;grid-template-areas:"logo ctrl" "search search";height:auto;row-gap:8px;padding:12px 0 10px}
  .logo{grid-area:logo}.ctrl{grid-area:ctrl}.search{grid-area:search}
  .search kbd{display:none}
  .wrap{display:block}
  nav{position:sticky;top:var(--hdr,112px);z-index:10;display:flex;gap:16px;max-height:none;overflow-x:auto;padding:10px var(--gut);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav .label,nav a span{display:none}
  nav a{display:block;flex:none;padding:0}
  nav a.on{text-decoration:underline;text-underline-offset:4px}
  main{padding:0 var(--gut) calc(var(--tray-h) + 40px);border-left:0}
  .t{font-size:26px}
  nav .label.idx{margin-top:0}
  .fonts .add{display:none}
  .rule{grid-template-columns:12px minmax(0,1fr) 3ch}
  .rule code{display:none}
  .tray{grid-template-columns:minmax(0,1fr) auto}
  .tray>.label{display:none}
  .btn{padding:0 10px}
}
</style>
</head>
<body>
<header>
  <div class="logo"><b>U+</b><span class="label">Glyph<br>Lab</span></div>
  <div class="search">
    <input id="q" type="search" placeholder="Search — arrow, dash, U+2192, €" autocomplete="off" spellcheck="false" aria-label="Search characters">
    <kbd>/</kbd>
  </div>
  <div class="ctrl">
    <div class="opts fonts" role="group" aria-label="Glyph typeface">
      <button data-font="times" aria-pressed="true">Times</button>
      <button data-font="mono" aria-pressed="false">Mono</button>
      <button data-font="drop" aria-pressed="false" class="drop-btn" hidden></button>
      <button class="x" id="rmFont" title="Remove font" aria-label="Remove font" hidden>×</button>
      <button class="add" id="addFont" title="Pick or drop a font file">+ Font</button>
      <input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2,.ttc" hidden>
    </div>
    <div class="opts themes" role="group" aria-label="Theme">
      <button data-theme="black" aria-pressed="true" title="Black" aria-label="Black"></button>
      <button data-theme="white" aria-pressed="false" title="White" aria-label="White"></button>
      <button data-theme="paper" aria-pressed="false" title="Paper" aria-label="Paper"></button>
    </div>
  </div>
</header>

<div class="wrap">
  <nav id="nav" aria-label="Categories"></nav>
  <main id="main"></main>
  <aside id="insp" aria-live="polite">
    <div class="label"><span>Specimen</span><span class="nb"><button id="prevCp" title="Previous code point (←)">←</button><span id="code"></span><button id="nextCp" title="Next code point (→)">→</button></span></div>
    <div class="big" id="big">¶</div>
    <p class="name" id="name">Hover a character</p>
    <p class="fontnote" id="fontNote" hidden></p>
    <div class="iacts"><button id="favBtn" title="Toggle favorite (F)">☆ Favorite</button><button id="linkBtn">Copy link</button></div>
    <div class="codes" id="codes"></div>
    <p class="hint">Click copies a character and adds it to the tray.<br><b>/</b> search · <b>Esc</b> clear · <b>← →</b> step through Unicode · <b>F</b> favorite<br>Drop a font file anywhere to see its coverage.</p>
  </aside>
</div>

<div class="tray">
  <label class="label" for="tray">Tray</label>
  <div class="field"><input id="tray" type="text" placeholder="Collected characters appear here" autocomplete="off" spellcheck="false"></div>
  <div class="acts">
    <button class="btn primary" id="copyTray">Copy</button>
    <button class="btn" id="clearTray">Clear</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="dropzone" id="dropzone"><div><b>Aa</b><span class="label">Drop a font — TTF · OTF · WOFF · WOFF2</span></div></div>

      const ok = all ? scores.every(Boolean) : scores.some(Boolean);
      return ok || it.s === raw ? {it, score: (it.name === ql ? 100 : 0) + scores.reduce((a, b) => a + b, 0)} : null;

    : `<p class="empty">Nothing matches “${esc(raw)}”. Try a name like “arrow”, “quote”, “space”, or a code like U+00B6.</p>`);

}

// Copy
async function writeClip(text){

  catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch {}
    ta.remove(); return ok;
  }
}

function toast(html){

}
const preview = s => esc(s.length > 24 ? [...s].slice(0, 24).join("") + "…" : s).replace(/^\s|\s$/g, "␣") || "␣";

async function pick(it, el){

}
// Links and stepping: #U+2192 selects a character; ← → walk to its Unicode neighbours.
const uplus = it => it.cp != null ? "#U+" + hex(it.cp) : "";

}
function step(d){
  if (!shown || shown.cp == null) return;

}

  {id: "spaces", label: "Repeated spaces", ex: () => "two spaces → one", re: / {2,}/g, fix: " "},

  {id: "times", label: "x between numbers", ex: () => "4x5 → 4×5", re: /(\d)( ?)[xX]( ?)(?=\d)/g, fix: "$1$2×$3"},
  {id: "thousands", label: "Digit groups", ex: () => "10 000 → no-break space", re: /(\d) (?=\d{3}(?!\d))/g, fix: "$1 "},

const fixAll = t => RULES.filter(r => !xr.off.has(r.id)).reduce((t, r) => ruleApply(r, t, xr.style), t);
const XR_SAMPLE = "\"Välkommen\" -- det kostar 10 000 kr... Vi ses 10-12 imorgon i rum 4x5 m.​\nRing 'Anna'  på 070 123 45 67 eller mejla anna@example.se. ";
let xr = {text: store.get("xray", ""), style: store.get("xrayStyle", "sv"), off: new Set(store.get("xrayOff", ["range"]))};
if (!QUOTES[xr.style]) xr.style = "sv";
let xrTimer;
function setXrayText(t){ xr.text = t; store.set("xray", t); }

const isPlain = c => /[0-9]/.test(c) || (/\p{L}/u.test(c) && /\p{Script=Latin}/u.test(c) && c.codePointAt(0) < 0x250);
function xrayHTML(text){
  let out = "", n = 0;
  for (const c of text){
    if (++n > 20000){ out += `<span class="xc ws"> … truncated</span>`; break; }
    if (isPlain(c)){ out += c; continue; }
    const it = item(c, null, "lookup"), cp = it.cp, d = `data-i="${it.i}"`;
    if (c === " ") out += `<span class="xc sp" ${d}> </span>`;
    else if (c === "\n") out += `<span class="xc ws" ${d}>¶</span>\n`;
    else if (c === "\t") out += `<span class="xc ws" ${d}>→</span>\t`;
    else if (tag(cp) || cp < 0x20 || (cp >= 0x7F && cp < 0xA0)) out += `<span class="xc pill" ${d}>${tag(cp) || "U+" + hex(cp)}</span>`;
    else if (cp < 0x80) out += `<span class="xc${/["'`]/.test(c) ? " warn" : ""}" ${d}>${esc(c)}</span>`;
    else out += `<span class="xc hi" ${d}>${esc(show(it))}</span>`;
  }
  return out;
}

function renderXray(){

  const styles = [["sv", "”…”", "Swedish"], ["svg", "»…»", "Swedish guillemets"], ["en", "“…”", "English"]];
  $("#main").innerHTML = `
  <section id="s-xray"><h2>Text X-ray<em>Paste anything</em></h2>
    <textarea id="xrIn" spellcheck="false" placeholder="Paste text to see every character in it"></textarea>
    <div class="xr-bar"><span class="label" id="xrStats"></span><button class="link" id="xrSample">Load example</button></div></section>
  <section><h2>Reading<em>· space  ¶ line break  ▢ hidden</em></h2><div class="xr-out" id="xrOut"></div></section>
  <section><h2>Fixes <span class="opts" id="xrStyle">${styles.map(([k, v, t]) => `<button data-qs="${k}" title="${t} quotes" aria-pressed="${k === xr.style}">${v}</button>`).join("")}</span><em id="xrFixN"></em></h2>
    <div class="rules" id="xrRules"></div>
    <div class="xr-acts"><button class="btn primary" id="xrApply">Apply fixes</button><button class="btn" id="xrCopy">Copy fixed</button></div></section>
  <section><h2>Characters<em id="xrCharN"></em></h2><div id="xrChars"></div></section>`;

function updateFixTotal(){
  const n = RULES.filter(r => !xr.off.has(r.id)).reduce((n, r) => n + ruleCount(r, xr.text), 0);
  $("#xrFixN").textContent = n ? `${pad(n, 2)} to fix` : "Clean";
}
function updateXray(){
  const t = xr.text, chars = [...t];
  $("#xrOut").innerHTML = t ? xrayHTML(t) : `<span class="none">Nothing pasted yet.</span>`;
  const counts = new Map();
  for (const c of chars) if (!isPlain(c) && c !== " " && c !== "\n") counts.set(c, (counts.get(c) || 0) + 1);
  const special = [...counts.keys()].filter(c => c.codePointAt(0) > 0x7E || tag(c.codePointAt(0)));
  const hidden = chars.filter(c => tag(c.codePointAt(0)) && c !== " " && c !== "\n").length;
  $("#xrStats").textContent = `${chars.length} chars · ${special.length} special · ${hidden} hidden`;
  $("#xrRules").innerHTML = RULES.map(r => {
    const n = ruleCount(r, t);
    return `<label class="rule${n ? "" : " none"}"><input type="checkbox" data-rule="${r.id}"${xr.off.has(r.id) ? "" : " checked"}><span>${r.label}</span><code>${esc(r.ex(xr.style))}</code><em>${n ? pad(n, 2) : "—"}</em></label>`;
  }).join("");
  updateFixTotal();
  const list = [...counts].sort((a, b) => b[1] - a[1]).map(([c, n]) => tile(item(c, null, "lookup"), `<small class="n">${n}</small>`));
  $("#xrCharN").textContent = pad(list.length);
  $("#xrChars").innerHTML = list.length ? `<div class="grid">${list.join("")}</div>` : "";
  markSelected();
}
function xrayClick(e){
  if (view !== "xray") return false;

}

// Dropped font. Coverage comes from the font's own cmap table (TTF, OTF, TTC, WOFF);
// WOFF2 needs Brotli, so there coverage is estimated by checking whether glyph widths change with the fallback.
async function sfntInfo(buf){
  const dv = new DataView(buf), u16 = o => dv.getUint16(o), u32 = o => dv.getUint32(o);
  const tag = o => String.fromCharCode(dv.getUint8(o), dv.getUint8(o + 1), dv.getUint8(o + 2), dv.getUint8(o + 3));
  const tables = {};
  let read;
  if (tag(0) === "wOFF"){
    for (let i = 0, n = u16(12); i < n; i++){ const o = 44 + i * 20; tables[tag(o)] = {off: u32(o + 4), comp: u32(o + 8), len: u32(o + 12)}; }
    read = async t => t.comp === t.len ? new DataView(buf, t.off, t.len)
      : new DataView(await new Response(new Blob([new Uint8Array(buf, t.off, t.comp)]).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer());
  } else {
    const base = tag(0) === "ttcf" ? u32(12) : 0, sig = tag(base);
    if (!(sig === "\0\x01\0\0" || sig === "OTTO" || sig === "true")) return null;
    for (let i = 0, n = u16(base + 4); i < n; i++){ const o = base + 12 + i * 16; tables[tag(o)] = {off: u32(o + 8), len: u32(o + 12)}; }
    read = async t => new DataView(buf, t.off, t.len);
  }
  if (!tables.cmap) return null;
  return {cps: cmapSet(await read(tables.cmap)), name: tables.name ? nameOf(await read(tables.name)) : null};
}
function cmapSet(v){

  }

    const fmt = v.getUint16(off);

        const end = v.getUint16(ends + s * 2), start = v.getUint16(starts + s * 2), delta = v.getUint16(deltas + s * 2), ro = v.getUint16(ranges + s * 2);
        for (let c = start; c <= end && c !== 0xFFFF; c++){
          let g;
          if (!ro) g = (c + delta) & 0xFFFF;
          else { const a = ranges + s * 2 + ro + (c - start) * 2; g = a + 2 <= v.byteLength ? v.getUint16(a) : 0; if (g) g = (g + delta) & 0xFFFF; }
          if (g) set.add(c);
        }
      }
    } else if (fmt === 12){
      for (let i = 0, n = v.getUint32(off + 12); i < n; i++){
        const o = off + 16 + i * 12, start = v.getUint32(o), end = Math.min(v.getUint32(o + 4), start + 0x10000), g0 = v.getUint32(o + 8);
        for (let c = start; c <= end; c++) if (g0 + c - start) set.add(c);
      }
    }
  }
  return set;
}
function nameOf(v){
  // Prefer the full name (ID 4) over the family (ID 1), and Unicode records over Mac Roman.
  const count = v.getUint16(2), strings = v.getUint16(4);
  let best = null, rank = -1;
  for (let i = 0; i < count; i++){
    const o = 6 + i * 12, pid = v.getUint16(o), id = v.getUint16(o + 6), len = v.getUint16(o + 8), at = strings + v.getUint16(o + 10);
    if (id !== 4 && id !== 1) continue;
    const wide = pid === 0 || pid === 3, r = (id === 4 ? 2 : 0) + (wide ? 1 : 0);
    if (r <= rank || at + len > v.byteLength) continue;
    let s = "";
    if (wide) for (let j = 0; j + 1 < len; j += 2) s += String.fromCharCode(v.getUint16(at + j));
    else for (let j = 0; j < len; j++) s += String.fromCharCode(v.getUint8(at + j));
    if (s.trim()){ best = s.trim(); rank = r; }
  }
  return best;
}
function estimateCoverage(family){
  const cx = document.createElement("canvas").getContext("2d"), set = new Set();
  const w = (c, f) => { cx.font = `32px ${f}`; return cx.measureText(c).width; };
  // Present: same width whatever the fallback. Missing: identical to the fallback alone.
  for (const it of ITEMS) if (it.cp != null){
    const a = w(it.s, `"${family}", monospace`), b = w(it.s, `"${family}", serif`);
    if (a === b && !(a === w(it.s, "monospace") && b === w(it.s, "serif"))) set.add(it.cp);
  }
  return set;
}
const idb = (mode, fn) => new Promise((res, rej) => {
  const r = indexedDB.open("u-plus", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("kv");
  r.onerror = () => rej(r.error);
  r.onsuccess = () => { const tx = r.result.transaction("kv", mode), out = fn(tx.objectStore("kv")); tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error); };
});
function refresh(){
  q.value.trim() ? renderSearch(q.value) : view === "xray" ? updateXray() : renderAll();
  if (shown) inspect(shown);
}
async function useFont(buf, file, activate, persist){
  const family = "UPlusDrop" + Date.now();
  try { const face = new FontFace(family, buf); await face.load(); document.fonts.add(face); }
  catch { toast("The browser can't read that font file"); return; }
  let info = null;
  try { info = await sfntInfo(buf); } catch {}
  dropFont = {name: (info && info.name) || file.replace(/\.[^.]+$/, ""), family};
  fontCov = (info && info.cps) || estimateCoverage(family);
  document.documentElement.style.setProperty("--f-drop", `"${family}"`);
  const b = document.querySelector('.fonts [data-font="drop"]');
  b.textContent = b.title = dropFont.name; b.hidden = $("#rmFont").hidden = false; $("#addFont").hidden = true;
  if (!FONTS.includes("drop")) FONTS.push("drop");
  if (activate) setOpt("font", "drop", FONTS);
  refresh();
  if (persist) try { await idb("readwrite", s => s.put({buf, file}, "font")); } catch {}
  if (activate){
    const pool = ITEMS.filter(it => it.set !== "lookup" && it.set !== "recent");
    toast(`${esc(dropFont.name)} — ${pool.filter(covered).length} of ${pool.length} characters`);
  }
}
function removeFont(){
  dropFont = fontCov = null;
  FONTS.splice(FONTS.indexOf("drop"), 1);
  document.querySelector('.fonts [data-font="drop"]').hidden = $("#rmFont").hidden = true; $("#addFont").hidden = false;
  setOpt("font", "times", FONTS);
  refresh();
  idb("readwrite", s => s.delete("font")).catch(() => {});
}
async function readFontFile(f){
  if (!/\.(ttf|otf|ttc|woff2?)$/i.test(f.name)) return toast("Drop a TTF, OTF, WOFF or WOFF2 file");
  useFont(await f.arrayBuffer(), f.name, true, true);
}
$("#addFont").addEventListener("click", () => $("#fontFile").click());
$("#fontFile").addEventListener("change", e => { const f = e.target.files[0]; if (f) readFontFile(f); e.target.value = ""; });
$("#rmFont").addEventListener("click", removeFont);
const dz = $("#dropzone"), hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
let dragDepth = 0;
addEventListener("dragenter", e => { if (hasFiles(e)){ dragDepth++; dz.classList.add("on"); } });
addEventListener("dragleave", e => { if (hasFiles(e) && --dragDepth <= 0){ dragDepth = 0; dz.classList.remove("on"); } });
addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; dz.classList.remove("on");
  const f = e.dataTransfer.files[0]; if (f) readFontFile(f);
});

renderAll();
if (location.hash === "#xray"){ renderXray(); inspect(byStr.get("¶")); }
else if (!fromHash()) inspect(byStr.get("¶"));
try {
  idb("readonly", s => s.get("font")).then(f => { if (f && f.buf) useFont(f.buf, f.file, wantFont === "drop", false); }).catch(() => {});
} catch {}
</script>
